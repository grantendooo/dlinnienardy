name: Собрать APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Иконки, цвет иконки и вертикальная ориентация
        run: |
          cp -r android-res/mipmap-* android/app/src/main/res/
          sed -i 's#<color name="ic_launcher_background">.*</color>#<color name="ic_launcher_background">\#2B4A3C</color>#' android/app/src/main/res/values/ic_launcher_background.xml
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nardy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
